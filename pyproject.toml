[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticker-price-data"
version = "0.1.4"
description = "Unified ticker price data from Yahoo Finance, CoinGecko, and TradingView."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stephan Akkerman" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "exchange-calendars",
    "websocket-client>=1.9.0",
    "tradingview-scraper>=0.4.20",
    "ticker-classifier>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://github.com/StephanAkkerman/ticker-price-data"

[tool.hatch.build.targets.wheel]
packages = ["src/ticker_price_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[tool.ruff]
line-length = 88
# 0.16 added Markdown to the default discovery set, so the formatter started
# rewriting the Python code block in README.md. Restrict it to Python, as before.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Pinned rather than inherited: ruff's default rule set widened in 0.16, turning
# a clean tree into 85 findings with no code change. These four are what this
# codebase is clean against. Adopting the wider set is worth doing on its own
# terms, not as a silent CI break.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
