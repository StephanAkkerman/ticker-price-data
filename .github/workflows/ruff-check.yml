name: Run Ruff formatter

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: an unpinned linter silently changes what it enforces.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
